.chart-wrap { position:relative; border-radius:8px; overflow:hidden; background:#ffffff; border:1px solid rgba(12,181,245,0.15); }
canvas { width:100%; display:block; cursor:crosshair; }
.scrubber { padding:8px 16px 12px; display:none; background:#f8f9fb; }
.scrubber input { width:100%; accent-color:#0066cc; cursor:pointer; }
.date-label { text-align:center; font-size:0.7rem; color:#667; margin-top:2px; font-family:monospace; }

const PROJ_START = 125;
const canvas = document.getElementById('cpdp-canvas');
const ctx = canvas.getContext('2d');
const scrubberEl = document.getElementById('scrubber');
const slider = document.getElementById('slider');
const dateLabel = document.getElementById('date-label');

const NAVY='#003366', CYAN='#0099cc', RED='#cc0000', BG='#ffffff', GRID='#e8eaed', TXTMAIN='#333', TXTSUB='#777';
let dpr = window.devicePixelRatio||1;
let loops=0, animFrame=0, isAnimating=true, scrubberVisible=false, lastN=DATA.length;

function resize(){
    const w=canvas.parentElement.clientWidth; const h=Math.round(w*0.48);
    canvas.width=w*dpr; canvas.height=h*dpr;
    canvas.style.height=h+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
}
resize(); window.addEventListener('resize',()=>{ resize(); drawChart(lastN); });

function drawChart(n){
    lastN=n;
    const w=canvas.width/dpr, h=canvas.height/dpr;
    const pad={t:40,r:55,b:52,l:52};
    const cw=w-pad.l-pad.r, ch=h-pad.t-pad.b;

    ctx.fillStyle=BG; ctx.fillRect(0,0,w,h);
    const d=DATA.slice(0,n);

    // Compute ranges from ALL data for stable axes
    const allPce=DATA.filter(r=>r[1]!==null).map(r=>r[1]);
    const allModel=DATA.filter(r=>r[3]!==null).map(r=>r[3]);
    const allCpdp=DATA.map(r=>r[2]);
    const pceMin=0, pceMax=Math.ceil(Math.max(...allPce,...allModel)*10+3)/10;
    const cpdpMin=Math.floor(Math.min(...allCpdp)*10-1)/10;
    const cpdpMax=Math.ceil(Math.max(...allCpdp)*10+3)/10;

    // Grid lines
    ctx.strokeStyle=GRID; ctx.lineWidth=0.5;
    const yticks=6;
    for(let i=0;i<=yticks;i++){
        const y=pad.t+ch*(1-i/yticks);
        ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(pad.l+cw,y); ctx.stroke();
    }

    // LHS axis labels (PCE %)
    ctx.fillStyle=TXTMAIN; ctx.font='bold 10px sans-serif'; ctx.textAlign='right';
    for(let i=0;i<=yticks;i++){
        const y=pad.t+ch*(1-i/yticks);
        const pv=pceMin+(pceMax-pceMin)*i/yticks;
        ctx.fillText(pv.toFixed(2)+'%',pad.l-6,y+3);
    }

    // RHS axis labels (CPDP)
    ctx.fillStyle=CYAN; ctx.font='10px sans-serif'; ctx.textAlign='left';
    for(let i=0;i<=yticks;i++){
        const y=pad.t+ch*(1-i/yticks);
        const cv=cpdpMin+(cpdpMax-cpdpMin)*i/yticks;
        ctx.fillText(cv.toFixed(2),w-pad.r+6,y+3);
    }
    ctx.textAlign='left';

    function xPos(i){ return pad.l+(i/(n-1||1))*cw; }
    function yPce(v){ return pad.t+ch*(1-(v-pceMin)/(pceMax-pceMin)); }
    function yCpdp(v){ return pad.t+ch*(1-(v-cpdpMin)/(cpdpMax-cpdpMin)); }

    // Stat box (top-left, matching Bloomberg style)
    ctx.strokeStyle='#888'; ctx.lineWidth=1;
    const bx=pad.l+8, by=pad.t+6, bw=150, bh=32;
    ctx.strokeRect(bx,by,bw,bh);
    ctx.fillStyle=BG; ctx.fillRect(bx+1,by+1,bw-2,bh-2);
    ctx.fillStyle=TXTMAIN; ctx.font='10px sans-serif';
    ctx.fillText('Correlation = 74.1%',bx+8,by+13);
    ctx.fillText('R2 = 54.9%',bx+8,by+26);

    // PCE line (dark navy, thick)
    ctx.strokeStyle=NAVY; ctx.lineWidth=2.5; ctx.beginPath();
    let started=false;
    for(let i=0;i<n;i++){
        if(d[i][1]===null) continue;
        const x=xPos(i),y=yPce(d[i][1]);
        if(!started){ ctx.moveTo(x,y); started=true; } else ctx.lineTo(x,y);
    }
    ctx.stroke();

    // CPDP line (cyan, solid, runs all the way through)
    ctx.strokeStyle=CYAN; ctx.lineWidth=1.8; ctx.beginPath();
    for(let i=0;i<n;i++){
        if(d[i][2]===null) continue;
        const x=xPos(i),y=yCpdp(d[i][2]);
        i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.stroke();

    // PCE projection (red dotted) - Model PCE column
    ctx.strokeStyle=RED; ctx.lineWidth=1.5; ctx.setLineDash([3,3]);
    ctx.beginPath(); let pceProj=false;
    for(let i=0;i<n;i++){
        if(d[i][3]===null) continue;
        const x=xPos(i),y=yPce(d[i][3]);
        if(!pceProj){ ctx.moveTo(x,y); pceProj=true; } else ctx.lineTo(x,y);
    }
    ctx.stroke(); ctx.setLineDash([]);

    // 3.40% label with box
    if(n>=DATA.length){
        const modelPts=DATA.filter(r=>r[3]!==null);
        if(modelPts.length>0){
            // Find the peak model PCE value for label placement
            let peakIdx=-1, peakVal=0;
            for(let i=0;i<n;i++){
                if(d[i][3]!==null && d[i][3]>peakVal){ peakVal=d[i][3]; peakIdx=i; }
            }
            if(peakIdx>=0){
                const lx=xPos(peakIdx), ly=yPce(peakVal);
                // Draw label box
                const lbl='3.40%';
                ctx.font='bold 10px sans-serif';
                const tw=ctx.measureText(lbl).width;
                const lbx=lx-tw/2-4, lby=ly-22, lbw=tw+8, lbh=16;
                ctx.strokeStyle=RED; ctx.lineWidth=1;
                ctx.strokeRect(lbx,lby,lbw,lbh);
                ctx.fillStyle=BG; ctx.fillRect(lbx+1,lby+1,lbw-2,lbh-2);
                ctx.fillStyle=RED;
                ctx.fillText(lbl,lbx+4,lby+12);
            }
        }
    }

    // X-axis dates
    ctx.fillStyle=TXTSUB; ctx.font='9px sans-serif'; ctx.textAlign='center';
    const step=Math.max(1,Math.floor(n/6));
    for(let i=0;i<n;i+=step){
        const parts=d[i][0].split('/');
        ctx.fillText(parts[0]+'/'+parts[1]+'/'+parts[2],xPos(i),pad.t+ch+16);
    }
    // Always show last date
    if(n>1){
        const parts=d[n-1][0].split('/');
        ctx.fillText(parts[0]+'/'+parts[1]+'/'+parts[2],xPos(n-1),pad.t+ch+16);
    }
    ctx.textAlign='left';

    // Bottom legend (centered, matching Bloomberg)
    const legendY=pad.t+ch+32;
    ctx.font='bold 10px sans-serif';
    // PCE legend
    const pceLabel='PCE CYOY Index (LHS)';
    const cpdpLabel='Lazar CPDP Model 16Mo. Lag (RHS)';
    const pceLblW=ctx.measureText(pceLabel).width;
    const cpdpLblW=ctx.measureText(cpdpLabel).width;
    const totalW=30+pceLblW+40+30+cpdpLblW;
    const startX=(w-totalW)/2;

    // Navy line + label
    ctx.strokeStyle=NAVY; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.moveTo(startX,legendY); ctx.lineTo(startX+25,legendY); ctx.stroke();
    ctx.fillStyle=NAVY;
    ctx.fillText(pceLabel,startX+30,legendY+4);

    // Cyan line + label
    const cx2=startX+30+pceLblW+40;
    ctx.strokeStyle=CYAN; ctx.lineWidth=1.8;
    ctx.beginPath(); ctx.moveTo(cx2,legendY); ctx.lineTo(cx2+25,legendY); ctx.stroke();
    ctx.fillStyle=CYAN;
    ctx.fillText(cpdpLabel,cx2+30,legendY+4);
}

// Hover tooltip
canvas.addEventListener('mousemove',function(e){
    if(isAnimating) return;
    const rect=canvas.getBoundingClientRect();
    const mx=e.clientX-rect.left, w=rect.width;
    const pad_l=52,pad_r=55,cw=w-pad_l-pad_r;
    const idx=Math.round(((mx-pad_l)/cw)*(lastN-1));
    if(idx>=0&&idx<lastN){
        drawChart(lastN);
        const d=DATA[idx], x=pad_l+(idx/(lastN-1||1))*cw;
        const h=canvas.height/dpr;
        ctx.strokeStyle='rgba(0,0,0,0.15)'; ctx.lineWidth=1;
        ctx.beginPath(); ctx.moveTo(x,40); ctx.lineTo(x,h-52); ctx.stroke();
        ctx.fillStyle='rgba(255,255,255,0.95)';
        const bw=170, bh=48;
        const bx=Math.min(x+10,canvas.width/dpr-bw-10);
        ctx.fillRect(bx,45,bw,bh);
        ctx.strokeStyle='#ccc'; ctx.strokeRect(bx,45,bw,bh);
        ctx.font='10px sans-serif'; ctx.fillStyle='#333';
        ctx.fillText(d[0],bx+8,60);
        ctx.fillStyle=NAVY; ctx.font='bold 10px sans-serif';
        ctx.fillText('PCE: '+(d[1]!==null?d[1].toFixed(2)+'%':'—'),bx+8,74);
        ctx.fillStyle=CYAN;
        ctx.fillText('CPDP: '+(d[2]!==null?d[2].toFixed(4):'—'),bx+8,87);
    }
});

slider.addEventListener('input',function(){
    isAnimating=false;
    drawChart(+this.value);
    dateLabel.textContent=DATA[+this.value-1][0];
});

function animate(){
    if(!isAnimating) return;
    animFrame+=2;
    const n=Math.min(animFrame,DATA.length);
    drawChart(n);
    if(n>=DATA.length){
        loops++;
        if(loops>=3&&!scrubberVisible){ scrubberEl.style.display='block'; scrubberVisible=true; }
        if(loops<8){ setTimeout(()=>{ animFrame=0; requestAnimationFrame(animate); },2500); }
        return;
    }
    setTimeout(()=>requestAnimationFrame(animate),60);
}
animate();
})();
